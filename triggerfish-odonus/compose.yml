# Bosun x-bosun.static declaration: Odonus, built by `make static` in triggerfish.
# trigger-fish.app (docs/kb/plans/vetula-one-surface.md). `quartermaster
# publish` stages a clean artifact and drops this file and registry.json.
services:
  trigger-fish-odonus:
    x-bosun:
      host: cloudflare
      probe: http
      static:
        channel: cloudflare-pages-wrangler
        cfProject: trigger-fish-odonus
        artifactDir: /Users/afc/work/afc-work/cloudflare-sites/triggerfish-odonus
        url: https://odonus.trigger-fish.app
