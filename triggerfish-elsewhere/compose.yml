# Bosun x-bosun.static declaration: the machines that need the installed rig
# (balistes, selene, limulus, conspicillum, quadrat, and www) answer at their
# own trigger-fish.app names with a redirect to the apex's "The whole rig".
# The names beyond `url` are attached to the project by hand (README ⁵).
services:
  trigger-fish-elsewhere:
    x-bosun:
      host: cloudflare
      probe: http
      static:
        channel: cloudflare-pages-wrangler
        cfProject: trigger-fish-elsewhere
        artifactDir: /Users/afc/work/afc-work/cloudflare-sites/triggerfish-elsewhere
        url: https://balistes.trigger-fish.app
